# Builds the Yggltree Mac app (one DMG per chip) when a version tag is pushed, and publishes the
# DMGs and their checksums on a GitHub release. Bump the version in the root package.json first:
# the app reports that number.
#
# Only the publish job can write to the repository. The build jobs get a read-only token and don't keep
# the checkout's credentials. They install with --ignore-scripts: the Mac build needs none of the
# dependencies' install scripts (Electron downloads its own binary when packaging). Actions are pinned
# to commit SHAs (the v4 releases at the time of writing); change them on purpose.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install and test
        run: |
          npm ci --ignore-scripts
          npm test -w hub
          npm test -w frontend
      - name: Build the frontend
        run: npm run build
      - name: Build the desktop app
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm test
          node scripts/stage.mjs --arch ${{ matrix.arch }}
          npx electron-builder --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Yggltree-${{ matrix.arch }}
          path: desktop/dist/Yggltree-${{ matrix.arch }}.dmg

  publish:
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum Yggltree-*.dmg > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/Yggltree-arm64.dmg release/Yggltree-x64.dmg release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Yggltree ${GITHUB_REF_NAME#v}" \
            --generate-notes
